language: typescript
layer: application
stack: frontend
dependsOn:
  - solid

tasks:
  typecheck:
    command: "tsc --noEmit"
  dev:
    command: "pnpm dev"
  build:
    command: "pnpm build"
    deps:
      - "typecheck"
    inputs:
      - "src/**/*"
      - "astro.config.mjs"
      - "package.json"
    outputs:
      - "dist"
  preview:
    command: "pnpm preview"
    deps:
      - "build"
